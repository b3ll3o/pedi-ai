# OpenObserve — observability self-hosted (100% OSS, 0 custo de licença)
#
# Subir: docker compose -f docker-compose.openobserve.yml up -d
# Acessar UI: http://localhost:5080 (usuário/senha definidos em ZO_ROOT_USER_*)
#
# **Requisitos mínimos:**
# - VPS 2 vCPU / 4 GB RAM (OpenObserve standalone roda em ~500MB)
# - 50 GB disco para ~30 dias de retenção (ajustável via ZO_DATA_DIR + retention)
#
# **Apontar a API do pedi-ai:**
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://observability.pedi-ai.internal:5080/api/v1/otlp
#   OTEL_METRICS_EXPORTER=otlp
#
# Auditoria origem: OBSERVABILITY.md § Open-Source Stack.

version: '3.9'

services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: pedi-ai-openobserve
    restart: unless-stopped
    ports:
      - "5080:5080"   # UI + API
    volumes:
      - openobserve-data:/data
    environment:
      # Auth inicial — TROCAR em prod
      ZO_ROOT_USER_EMAIL: ${OO_ADMIN_EMAIL:-admin@pedi-ai.com}
      ZO_ROOT_USER_PASSWORD: ${OO_ADMIN_PASSWORD:-CHANGE_ME_NOW}
      # Storage local (não usa ClickHouse — próprio engine em Rust + Parquet)
      ZO_DATA_DIR: /data
      # Retention: 30 dias logs, 90 dias métricas, 30 dias traces
      ZO_LOGS_FILE_RETENTION: "720"      # horas = 30 dias
      ZO_METRICS_FILE_RETENTION: "2160"  # horas = 90 dias
      ZO_TRACES_FILE_RETENTION: "720"    # horas = 30 dias
      # Limites de ingest para evitar OOM no VPS pequeno
      ZO_INGEST_ALLOWED_UPTO: "100"      # MB/s — proteger contra burst acidental
      ZO_MAX_FILE_SIZE_IN_MEM: "128"     # MB — buffer em memória antes de flush
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G    # OpenObserve + Rust runtime cabe em 2GB
        reservations:
          memory: 512M

volumes:
  openobserve-data:
    driver: local