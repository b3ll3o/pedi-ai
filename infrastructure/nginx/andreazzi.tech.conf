# ============================================================
# Pedi-AI — nginx config para VPS standalone (sem Docker Compose)
#
# Diferenças em relação a `docker/nginx.prod.conf`:
#   - Upstreams apontam pra `127.0.0.1:3000/3001` (apps rodando
#     via systemd, não em containers).
#   - TLS usa Let's Encrypt via /etc/letsencrypt/.
#   - SSL certs Docker (/etc/nginx/certs/) trocados pelos do certbot.
#
# Instalação:
#   sudo cp infrastructure/nginx/andreazzi.tech.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# Upstreams: apps rodando via systemd em loopback.
upstream pedi_ai_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream pedi_ai_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Esconde versão do Nginx em respostas e erros.
server_tokens off;
more_clear_headers Server;

# ─── HTTP → HTTPS (porta 80 só pra challenge ACME do certbot) ─────
server {
    listen 80;
    server_name andreazzi.tech;
    return 301 https://$host$request_uri;
}

# ─── HTTPS (porta 443) ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name andreazzi.tech;

    # TLS via Let's Encrypt (certbot).
    ssl_certificate /etc/letsencrypt/live/andreazzi.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/andreazzi.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # ─── Security headers ─────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP: mais permissiva que Docker (precisa de unsafe-eval pra Next dev/HMR
    # em algumas rotas). Em prod puro, restrinja mais.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' ws: wss: http: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ─── Rate limiting (proteção básica contra abuso) ─────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # ─── Logs ─────────────────────────────────────────────
    access_log /var/log/nginx/andreazzi.tech.access.log;
    error_log  /var/log/nginx/andreazzi.tech.error.log warn;

    # ─── Web (Next.js na 3000) ────────────────────────────
    location / {
        proxy_pass http://pedi_ai_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ─── API (NestJS na 3001) ─────────────────────────────
    # /api/* → strip prefix → API.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://pedi_ai_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        limit_req zone=api_limit burst=60 nodelay;
    }
}