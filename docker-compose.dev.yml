# ============================================================
# Pedi-AI — Development Environment (Docker Compose)
# Para VPS dev: single host, hot reload habilitado
# ============================================================

services:
  # ── PostgreSQL 16 ──────────────────────────────────────────
  # Sem bind externo de porta 5432. Conflito na VPS: o container admin
  # `postgres` (postgres-setup, criado em 2026-05-26, parte do pgadmin
  # rodando na :5050) segura 0.0.0.0:5432 há meses, e o `ports: "5432"`
  # do pedi-ai falha com "port is already allocated" antes mesmo de
  # criar o container. Api e web acessam postgres pela rede Docker
  # interna (DNS `postgres:5432`), então o bind externo é dispensável
  # — só era usado pra `psql` do host, e ninguém nos workflows CI/CD/
  # deploy conecta via host:5432 (todos via `docker exec`).
  postgres:
    image: postgres:16-alpine
    container_name: pedi_ai_postgres
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_DB: pedi_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatório (veja .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/prisma/docker-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── SMTP Mock (Mailpit) ────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: pedi_ai_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"  # SMTP
      - "127.0.0.1:8025:8025"  # Web UI
    environment:
      MTX_DEBUG: "0"

  # ── NestJS API ─────────────────────────────────────────────
  # Sem bind externo de porta 3001. Conflito na VPS: systemd services
  # legacy `pedi-ai-api.service` rodam `node dist/main.js` direto no
  # host (PID 3440311, workingdir /root/pedi-ai/apps/api), ocupando
  # 0.0.0.0:3001 e reiniciando automaticamente. Bind externo do container
  # api é dispensável — nginx upstream usa `api:3001` (DNS Docker),
  # testes E2E rodam via `docker exec` (localhost), e tráfego externo
  # chega via nginx na :80.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: pedi_ai_api
    restart: unless-stopped
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatório}@postgres:5432/pedi_ai
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET é obrigatório (veja .env.example)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET é obrigatório (veja .env.example)}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: "3001"
      HOST: "0.0.0.0"
      NODE_ENV: development
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./apps/api/src:/app/apps/api/src:ro
      - ./packages:/app/packages:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ── Next.js Web App ────────────────────────────────────────
  # Sem bind externo de porta 3000. Mesmo motivo da api: systemd
  # service `pedi-ai-web.service` mantém `next-server` direto no host
  # (PID 3440347) ocupando 0.0.0.0:3000. Nginx upstream usa `web:3000`
  # (DNS Docker); testes E2E via `docker exec` batem em localhost:3000
  # dentro do container; tráfego externo entra pela :80 do nginx.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: pedi_ai_web
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatório}@postgres:5432/pedi_ai
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3001}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    volumes:
      - ./apps/web/src:/app/src:ro
      - ./packages:/app/packages:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

# ── Nginx Reverse Proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: pedi_ai_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: pedi_ai_network